<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Archive</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Landing Page -->
    <div id="landing-page" class="landing-page">
        <div class="landing-content">
            <h1 class="main-title">Reading Archive</h1>
            <p class="subtitle">Archive of things I've read recently and found interesting</p>
            <p class="sub-subtitle"><em>Interesting pieces. Not necessarily accurate or well-written</em></p>

            <div class="category-tiles">
                <div class="category-tile">
                    <h2>Articles</h2>
                    <span class="count" id="articles-count">0</span>
                </div>
            </div>

            <button class="browse-btn" onclick="enterCatalog()">Browse Catalog</button>
        </div>
    </div>

    <!-- Pillars Page (scrollable, contains pillars + nerds section) -->
    <div id="pillars-page" class="pillars-page hidden">
        <!-- Pillars Section (first screen) -->
        <div class="pillars-section">
            <button class="pillars-back-btn" onclick="showLanding()" title="Back to home">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="9.5" stroke="currentColor" />
                    <path d="M11.5 6L7.5 10L11.5 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <div class="pillars-greeting" id="pillars-greeting">Hi there</div>
            <div id="pillars-container" class="pillars-container">
                <!-- Pillars will be dynamically inserted here -->
            </div>
            <button class="corner-nav-btn" id="corner-nav-btn">
                <span class="corner-nav-text">Meet the other nerds</span>
                <svg class="corner-nav-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 2V12M7 12L3 8M7 12L11 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <!-- Nerds Section (second screen, scrolled to) -->
        <div id="nerds-section" class="nerds-section">
            <h2 class="nerds-title">Say Hi to the Others</h2>
            <div class="nerds-grid" id="nerds-grid">
                <!-- Nerd tiles inserted by JS -->
            </div>
        </div>



        <!-- Profile Pane (popup on nerd click) -->
        <div class="profile-overlay hidden" id="profile-overlay">
            <div class="profile-pane" id="profile-pane">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- Scroll View Page -->
    <div id="scroll-page" class="scroll-page hidden">
        <button class="scroll-back-btn" onclick="showPillars()" title="Back to pillars">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="9.5" stroke="currentColor" />
                <path d="M11.5 6L7.5 10L11.5 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
        <h2 class="scroll-category-title" id="scroll-category-title"></h2>
        <div id="scroll-container" class="scroll-container">
            <!-- Article cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
